name: Generate Android Keystore (one-time)

# این ورک‌فلو فقط یک بار اجرا می‌شود تا یک keystore ثابت برای امضای APK بسازد.
# بعد از دانلود artifact و افزودن Secrets، این فایل را از مخزن حذف کنید.

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: 'رمز عبور keystore (حداقل 6 کاراکتر)'
        required: true
      key_password:
        description: 'رمز عبور کلید (alias) — می‌تواند همان رمز keystore باشد'
        required: true
      key_alias:
        description: 'نام alias کلید'
        required: true
        default: 'tradermind'

permissions:
  contents: read

jobs:
  generate:
    name: Generate keystore
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore tradermind-release.keystore \
            -alias "${{ inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ inputs.keystore_password }}" \
            -keypass "${{ inputs.key_password }}" \
            -dname "CN=TraderMind, OU=TraderMind, O=TraderMind, L=Tehran, ST=Tehran, C=IR"

      - name: Encode keystore to Base64
        run: base64 -w 0 tradermind-release.keystore > tradermind-release.keystore.b64

      - name: Upload keystore artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-keystore
          path: |
            tradermind-release.keystore
            tradermind-release.keystore.b64
          retention-days: 7
