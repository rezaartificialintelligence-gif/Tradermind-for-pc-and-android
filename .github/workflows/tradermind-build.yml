name: TraderMind Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PORT: 23583
  BASE_PATH: /

concurrency:
  group: tradermind-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, tests and web build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Use pnpm
        run: corepack prepare pnpm@10.26.1 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @workspace/tradermind run typecheck

      - name: Tests
        run: pnpm --filter @workspace/tradermind run test

      - name: Web build
        run: pnpm --filter @workspace/tradermind run build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: TraderMind-Web-Build
          path: artifacts/tradermind/dist/public
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows Setup.exe
    runs-on: windows-latest
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Use pnpm
        run: corepack prepare pnpm@10.26.1 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        run: pnpm --filter @workspace/tradermind run electron:build:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: TraderMind-Windows-Setup
          path: artifacts/tradermind/dist-electron/*.exe
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Use pnpm
        run: corepack prepare pnpm@10.26.1 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Decode release keystore
        working-directory: artifacts/tradermind
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > tradermind-release.keystore

      - name: Create Android platform
        working-directory: artifacts/tradermind
        env:
          ANDROID_KEYSTORE_PATH: ../../tradermind-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: pnpm run android:add

      - name: Sync Capacitor Android project
        working-directory: artifacts/tradermind
        run: pnpm run android:sync

      - name: Build release APK
        working-directory: artifacts/tradermind/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: TraderMind-Android-APK
          path: artifacts/tradermind/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
